[tool.poetry]
name = "library-catalog-serverless"
version = "0.1.0"
description = "Resilient, serverless application on AWS to manage book requests for a digital library catalog."
authors = ["Felipe <felipe_cortes@epam.com>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
boto3 = "^1.33.0"
requests = "^2.31.0"
pydantic = "^2.5.0"


[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
mypy = "^1.7.1"
black = "^23.12.1"
ruff = "^0.8.0"
pytest-cov = "^5.0.0"
pytest-mock = "^3.15.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ---------------------------
# Mypy configuration
# ---------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
# Agregamos esta línea para mayor estrictez y prevenir código incompleto
disallow_incomplete_defs = true
# Excluimos directorios que no deben ser analizados
exclude = ["tests", "deployments", "venv"]

# ---------------------------
# Ruff configuration
# ---------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
  "tests",
  ".git",
  "__pycache__",
  "venv"
]

[tool.ruff.lint]
select = [
  "E",    # Pycodestyle (errores)
  "F",    # Pyflakes
  "B",    # flake8-bugbear
  "C",    # flake8-comprehensions
  "I",    # isort (import sorting)
  "RUF",  # Reglas propias de Ruff
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "ANN",  # type annotations (Para asegurar que todo esté tipeado)
  "N",    # pep8-naming
]
fixable = ["ALL"]

# ---------------------------
# Pytest configuration
# ---------------------------
[tool.pytest.ini_options]
# Los archivos de prueba deben estar en el directorio 'tests'
testpaths = ["tests"]
python_files = ["test_*.py"]
# Flags comunes para verbosidad, trazas cortas y reporte de cobertura
addopts = "-vvv --tb=short --cov=src --cov-report=term-missing --maxfail=1"
