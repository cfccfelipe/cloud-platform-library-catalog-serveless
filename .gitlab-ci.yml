image: python:3.12-slim

variables:

  APP_ZIP_NAME: deployment_package.zip
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  TERRAFORM_DIR: infra/terraform/environments/qa
  LAMBDA_SRC_DIR: src/lambdas
  SCRIPTS_DIR: scripts


stages:
  - setup
  - build
  - infra
  - deploy

# -------------------------------------------------------------------------
# 1. SETUP STAGE
# -------------------------------------------------------------------------
.setup_dependencies:
  stage: setup
  script:
    - python -m pip install --upgrade pip
    - apt-get update && apt-get install -y make wget unzip
    - pip install poetry
    - poetry config virtualenvs.in-project true
    - poetry install
    - wget https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip
    - pip install --upgrade poetry
    - unzip terraform_1.5.7_linux_amd64.zip
    - mv terraform /usr/local/bin/

setup:
  stage: setup
  extends: .setup_dependencies
  artifacts:
    paths:
      - .venv/
      - /usr/local/bin/terraform
    expire_in: 1 day
  cache:
    key: poetry-dependencies
    paths:
      - .venv/

# -------------------------------------------------------------------------
# 2. BUILD STAGE
# -------------------------------------------------------------------------
.inherit_setup:
  stage: build
  cache:
    key: poetry-dependencies
    policy: pull
  dependencies:
    - setup

lint_and_test:
  extends: .inherit_setup
  script:
    - apt-get update && apt-get install -y make
    - pip install poetry
    - echo "Running quality checks (Ruff, Mypy, Pytest)..."
    - poetry run make check
  except:
    - main

package_lambda:
  extends: .inherit_setup
  script:
    - apt-get update && apt-get install -y make
    - pip install poetry
    - echo "Packaging Lambda code and dependencies..."
    - poetry run make zip
  artifacts:
    paths:
      - $APP_ZIP_NAME
  only:
    - main

# ------------------------------------------------------
# 3. INFRA STAGE (Terraform Provisioning/Update)
# -------------------------------------------------------------------------

.inherit_infra:
  stage: infra
  cache:
    key: poetry-dependencies
    policy: pull
  dependencies:
    - setup

terraform_plan:
  extends: .inherit_infra
  script:
    - echo "Validating and planning infrastructure changes..."
    # AWS environment variables must be configured in GitLab CI/CD settings
    - make infra-init
    - make infra-validate
    - make infra-plan
  artifacts:
    paths:
      - $APP_ZIP_NAME
  only:
    - main

