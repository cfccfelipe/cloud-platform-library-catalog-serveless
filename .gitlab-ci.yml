# =========================================================================
# GITLAB CI/CD PIPELINE: Serverless Library Catalog
# Manages code quality, Terraform infrastructure, and Lambda deployment.
# =========================================================================

image: python:3.11-slim

# Define global variables for configuration
variables:
  TF_ROOT: infra/terraform
  TF_PLAN: tfplan.out
  APP_ZIP_NAME: deployment_package.zip
  AWS_DEFAULT_REGION: $AWS_REGION

# Define the pipeline stages
stages:
  - setup
  - build
  # - infra
  # - deploy

# -------------------------------------------------------------------------
# 1. SETUP STAGE (Installation of essential tools)
# -------------------------------------------------------------------------

# Template job for installing all dependencies and tools
.setup_dependencies:
  script:
    - python -m pip install --upgrade pip

    # 1. Install system tools (make, wget, unzip)
    - apt-get update && apt-get install -y make wget unzip

    # 2. Install Poetry globally via pip --user
    - pip install --user poetry

    # 3. Configure Poetry to create .venv locally (essential for caching)
    - export PATH="$PATH:$HOME/.local/bin" # Add poetry to PATH for immediate use
    - poetry config virtualenvs.in-project true
    - poetry install

    # 4. Install Terraform and move it to a cacheable location
    - wget https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip
    - unzip terraform_1.5.7_linux_amd64.zip
    - mv terraform $HOME/.local/bin/

# Job that executes the installation and defines artifacts/cache
setup:
  stage: setup
  extends:
    - .setup_dependencies # Correct YAML list syntax

  # Ensure the necessary bin directory is available in this shell execution
  before_script:
    - export PATH="$PATH:$HOME/.local/bin"

  artifacts:
    # Pass the .venv (created locally) and the Terraform binary (in .local/bin)
    paths:
      - .venv/
      - $HOME/.local/bin/terraform
    expire_in: 1 day

  # Use cache to save the global installation of pip --user and poetry
  cache:
    key: $CI_COMMIT_REF_SLUG-poetry
    paths:
      - $HOME/.local/
      - .venv/

# -------------------------------------------------------------------------
# 2. BUILD STAGE (Code Validation and Packaging)
# -------------------------------------------------------------------------

# Base job to inherit necessary setup properties
.inherit_setup:
  stage: build
  # Re-establish PATH for global tools and restore cache
  before_script:
    - export PATH="$PATH:$HOME/.local/bin"
  cache:
    key: $CI_COMMIT_REF_SLUG-poetry
    policy: pull
  dependencies:
    - setup

lint_and_test:
  extends:
    - .inherit_setup
  script:
    - echo "Running quality checks (Ruff, Mypy, Pytest)..."
    # Use 'poetry run' to execute commands reliably inside the virtual environment
    - poetry run make check
  except:
    - main

package_lambda:
  extends:
    - .inherit_setup
  script:
    - echo "Packaging Lambda code and dependencies..."
    # Execute the make target which handles packaging logic (exports requirements and zips)
    - poetry run make zip

  artifacts:
    paths:
      - $APP_ZIP_NAME
  only:
    - main
