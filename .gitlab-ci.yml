# =========================================================================
# GITLAB CI/CD PIPELINE: Serverless Library Catalog
# Optimized version resolving PATH and dependency persistence errors.
# =========================================================================

image: python:3.11-slim

# Define global variables for configuration
variables:
  TF_ROOT: infra/terraform
  TF_PLAN: tfplan.out
  APP_ZIP_NAME: deployment_package.zip
  AWS_DEFAULT_REGION: $AWS_REGION

# Define the pipeline stages
stages:
  - setup
  - build
  - infra
  - deploy

# -------------------------------------------------------------------------
# 1. SETUP STAGE (Installation of essential tools)
# -------------------------------------------------------------------------

# CRITICAL: Define the global cache path for pip binaries
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

# Template job for installing all dependencies and tools
.setup_dependencies:
  stage: setup
  script:
    # 0. Set environment variables
    - mkdir -p $PIP_CACHE_DIR
    - export PIP_CACHE_DIR

    # 1. Install system tools (make, wget, unzip)
    - apt-get update && apt-get install -y make wget unzip

    # 2. Install Poetry globally (standard system path)
    - pip install poetry

    # 3. Configure Poetry to create .venv locally (essential for caching/artifacts)
    # The 'poetry' command is now available due to the installation in the script path.
    - poetry config virtualenvs.in-project true
    - poetry install

    # 4. Install Terraform and move it to a cacheable location
    - wget https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip
    - unzip terraform_1.5.7_linux_amd64.zip
    - mv terraform /usr/local/bin/

# Job that executes the installation and defines artifacts/cache
setup:
  stage: setup
  extends:
    - .setup_dependencies

  # Ensure the necessary bin directory is available in this shell execution
  before_script:
    # Adding system binaries path is often sufficient after global install
    - export PATH="$PATH:/usr/local/bin"

  artifacts:
    # Pass the local .venv (created by poetry)
    paths:
      - .venv/
      - /usr/local/bin/terraform
    expire_in: 1 day

  # Use cache to persist the installation of poetry/pip packages across jobs
  cache:
    key: poetry-dependencies
    paths:
      - .venv/
      - $PIP_CACHE_DIR
      - /usr/local/bin/terraform
    policy: push

# -------------------------------------------------------------------------
# 2. BUILD STAGE (Code Validation and Packaging)
# -------------------------------------------------------------------------

# Base job to inherit necessary setup properties
.inherit_setup:
  stage: build
  # No export PATH needed because 'poetry' is installed globally in the image path.
  # The cache restores the large .venv and the binary dependencies.
  cache:
    key: poetry-dependencies
    policy: pull
  dependencies:
    - setup

lint_and_test:
  extends:
    - .inherit_setup
  script:
    - echo "Running quality checks (Ruff, Mypy, Pytest)..."
    # 'poetry run' will now reliably find the poetry executable installed globally
    - poetry run make check
  except:
    - main

package_lambda:
  extends:
    - .inherit_setup
  script:
    - echo "Packaging Lambda code and dependencies..."
    - poetry run make zip

  artifacts:
    paths:
      - $APP_ZIP_NAME
  only:
    - main
