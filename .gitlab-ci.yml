# =========================================================================
# GITLAB CI/CD PIPELINE: Serverless Library Catalog
# ALTERNATIVA FINAL: Instalación de Poetry en cada job de Build.
# =========================================================================

image: python:3.11-slim

# Define global variables for configuration
variables:
  TF_ROOT: infra/terraform
  TF_PLAN: tfplan.out
  APP_ZIP_NAME: deployment_package.zip
  AWS_DEFAULT_REGION: $AWS_REGION

# Define the pipeline stages
stages:
  - setup
  - build
  - infra
  - deploy

# -------------------------------------------------------------------------
# 1. SETUP STAGE (Installation of essential tools)
# -------------------------------------------------------------------------

.setup_dependencies:
  stage: setup
  script:
    - python -m pip install --upgrade pip

    # 1. Instala make y herramientas del sistema
    - apt-get update && apt-get install -y make wget unzip

    # 2. Instala solo las dependencias del proyecto, forzando la creación local de .venv
    - pip install poetry # Poetry es necesario para el 'poetry install'
    - poetry config virtualenvs.in-project true
    - poetry install

    # 3. Instala Terraform y lo mueve a una ubicación conocida
    - wget https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip
    - unzip terraform_1.5.7_linux_amd64.zip
    - mv terraform /usr/local/bin/

# Job que ejecuta la instalación y define artifacts/cache
setup:
  stage: setup
  extends:
    - .setup_dependencies

  artifacts:
    # Pasa el .venv (creado localmente) y el binario de Terraform
    paths:
      - .venv/
      - /usr/local/bin/terraform
    expire_in: 1 day

  # Usa cache para guardar el .venv (más rápido que artifacts, recomendado)
  cache:
    key: poetry-dependencies
    paths:
      - .venv/

# -------------------------------------------------------------------------
# 2. BUILD STAGE (Code Validation and Packaging)
# -------------------------------------------------------------------------

# Base job para heredar la configuración de cache y entorno
.inherit_setup:
  stage: build
  # El cache debe restaurar el .venv.
  cache:
    key: poetry-dependencies
    policy: pull
  dependencies:
    - setup

lint_and_test:
  extends:
    - .inherit_setup
  script:
    # --- FIX CRÍTICO: Reinstala Poetry globalmente en este contenedor ---
    # Esto garantiza que 'poetry' sea accesible en el PATH.
    - pip install poetry

    - echo "Running quality checks (Ruff, Mypy, Pytest)..."
    # 'poetry run' ahora funciona porque 'poetry' está instalado,
    # y usa el .venv restaurado por el cache/artifacts.
    - poetry run make check
  except:
    - main

package_lambda:
  extends:
    - .inherit_setup
  script:
    # --- FIX CRÍTICO: Reinstala Poetry globalmente ---
    - pip install poetry

    - echo "Packaging Lambda code and dependencies..."
    - poetry run make zip

  artifacts:
    paths:
      - $APP_ZIP_NAME
  only:
    - main
