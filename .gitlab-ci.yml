# =========================================================================
# GITLAB CI/CD PIPELINE: Serverless Library Catalog
# Resolves dependency persistence issues by using global paths.
# =========================================================================

image: python:3.11-slim

# Define global variables for configuration
variables:
  TF_ROOT: infra/terraform
  TF_PLAN: tfplan.out
  APP_ZIP_NAME: deployment_package.zip
  # Define a global bin path for manually installed binaries (Terraform, Poetry)
  GLOBAL_BIN_PATH: /usr/local/bin
  AWS_DEFAULT_REGION: $AWS_REGION

# Define the pipeline stages
stages:
  - setup
  - build
  # - infra
  # - deploy

# -------------------------------------------------------------------------
# 1. SETUP STAGE (Installation of essential tools)
# -------------------------------------------------------------------------

.setup_dependencies:
  stage: setup
  script:
    - python -m pip install --upgrade pip

    # 1. Install system tools (make, wget, unzip)
    - apt-get update && apt-get install -y make wget unzip

    # 2. Install Poetry globally into the image's environment (no --user)
    # This makes 'poetry' immediately available in the PATH for this and subsequent jobs.
    - pip install poetry

    # 3. Configure Poetry to create .venv locally (essential for artifacts/cache)
    - poetry config virtualenvs.in-project true
    - poetry install

    # 4. Install Terraform and move it to the global path
    - wget https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip
    - unzip terraform_1.5.7_linux_amd64.zip
    - mv terraform $GLOBAL_BIN_PATH/ # Moves Terraform to /usr/local/bin/

# Job that executes the installation and defines artifacts/cache
setup:
  stage: setup
  extends:
    - .setup_dependencies

  # before_script is now unnecessary here as 'poetry' is installed globally
  # and the cache will handle the environment.

  artifacts:
    # Pass the local .venv (created by poetry install) and the global binary path
    paths:
      - .venv/
      - $GLOBAL_BIN_PATH/terraform # Reference to /usr/local/bin/terraform
    expire_in: 1 day

  # Use cache to save the large .venv directory
  cache:
    key: $CI_COMMIT_REF_SLUG-poetry
    paths:
      - .venv/

# -------------------------------------------------------------------------
# 2. BUILD STAGE (Code Validation and Packaging)
# -------------------------------------------------------------------------

# Base job to inherit necessary setup properties
.inherit_setup:
  stage: build
  # No export PATH needed because 'poetry' and 'terraform' are in /usr/local/bin
  # and /usr/local/bin is usually in the default PATH of a Linux image.
  cache:
    key: $CI_COMMIT_REF_SLUG-poetry
    policy: pull # Pulls the cached .venv
  dependencies:
    - setup

lint_and_test:
  extends:
    - .inherit_setup
  script:
    - echo "Running quality checks (Ruff, Mypy, Pytest)..."
    # 'poetry run' will now be found globally and will correctly use the restored .venv
    - poetry run make check
  except:
    - main

package_lambda:
  extends:
    - .inherit_setup
  script:
    - echo "Packaging Lambda code and dependencies..."
    - poetry run make zip

  artifacts:
    paths:
      - $APP_ZIP_NAME
  only:
    - main
