# =========================================================================
# GITLAB CI/CD PIPELINE: Serverless Library Catalog
# Manages code quality, Terraform infrastructure, and Lambda deployment.
# =========================================================================

# Use a common Python image with necessary system tools
image: python:3.11-slim

# Define global variables for configuration
variables:
  # Directory where Terraform configuration resides
  TF_ROOT: infra/terraform
  # Terraform plan output file
  TF_PLAN: tfplan.out
  # Name of the zipped application file (from Makefile)
  APP_ZIP_NAME: deployment_package.zip
  # AWS region (Set as GitLab CI/CD Variable for security)
  AWS_DEFAULT_REGION: $AWS_REGION

# Define the pipeline stages
stages:
  - setup
  - build
  # - infra
  # - deploy

# -------------------------------------------------------------------------
# 1. SETUP STAGE (Installation of essential tools)
# -------------------------------------------------------------------------

.setup_dependencies:
  stage: setup
  script:
    - python -m pip install --upgrade pip
    # Install Poetry for dependency management
    - pip install poetry
    # Install project dependencies
    - poetry install

    # --- INSTALL MAKE COMMAND HERE ---
    - apt-get update && apt-get install -y make wget unzip

    # Install Terraform CLI (required for infra stage)
    - apt-get update && apt-get install -y wget unzip
    - wget https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip
    - unzip terraform_1.5.7_linux_amd64.zip
    - mv terraform /usr/local/bin/

setup:
  extends: .setup_dependencies
  artifacts:
    # Cache and pass the environment and Terraform binary to subsequent stages
    paths:
      - .venv/
      - /usr/local/bin/terraform

# -------------------------------------------------------------------------
# 2. BUILD STAGE (Code Validation and Packaging)
# -------------------------------------------------------------------------

lint_and_test:
  stage: build
  script:
    - echo "Running quality checks (Ruff, Mypy, Pytest)..."
    # Execute quality checks using Poetry environment
    - make check
  except:
    - main # Run on feature branches

package_lambda:
  stage: build
  script:
    - echo "Packaging Lambda code and dependencies..."
    # Call the 'zip' target from the Makefile to create the deployment package
    - make zip
  artifacts:
    # Pass the ZIP file to the deploy stage
    paths:
      - $(APP_ZIP_NAME)
  only:
    - main # Only package for main branch deployment

